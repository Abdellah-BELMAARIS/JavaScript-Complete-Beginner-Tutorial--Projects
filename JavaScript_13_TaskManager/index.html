<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App - Full Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>⚡ Task Manager</h1>
            <p>JavaScript Complete Beginner Course Capstone Project</p>
        </header>

        <form id="task-form" class="task-form">
            <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off" required>
            <button type="submit">Add Task</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list" class="task-list">
            <!-- Dynamically populated by app.js -->
        </ul>

        <footer class="task-footer">
            <span id="task-count">0 items left</span>
            <button id="clear-completed" class="clear-btn">Clear Completed</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
